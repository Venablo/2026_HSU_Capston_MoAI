version: '3.8'

services:
  moai-mysql:
    image: mysql:8.0
    container_name: moai-mysql
    platform: linux/amd64
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: moai2026
      MYSQL_DATABASE: moai_db
    restart: always

  moai-redis:
    image: redis:latest
    container_name: moai-redis
    ports:
      - "6379:6379"
    restart: always