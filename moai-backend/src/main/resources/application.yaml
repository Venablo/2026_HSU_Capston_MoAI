spring:
  application:
    name: MoAI

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      connection-timeout: 10000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 1800000 # 30분 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

llm:
  api-key: ${LLM_API_KEY}
  api-url: https://generativelanguage.googleapis.com/v1beta/models
  model: gemini-3.1-flash-lite-preview

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  fallback-keys: ${YOUTUBE_FALLBACK_KEYS:}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      enabled: ${AWS_S3_ENABLED:false}
    region:
      static: ${AWS_REGION}

subtitle:
  # 콤마 구분 후보 리스트 — 앞에서부터 시도하여 실행 가능한 첫 명령 사용 (Windows: py / python, Unix: python3)
  python-bin: ${SUBTITLE_PYTHON_BIN:python3,python,py}
  script-path: ${SUBTITLE_SCRIPT_PATH:src/main/resources/scripts/scrape_subtitle.py}
  timeout-sec: ${SUBTITLE_TIMEOUT_SEC:30}
  preferred-langs: ${SUBTITLE_PREFERRED_LANGS:ko,en}
  enable-fallback: ${SUBTITLE_ENABLE_FALLBACK:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never