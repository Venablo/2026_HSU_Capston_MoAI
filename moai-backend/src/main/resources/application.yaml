spring:
  application:
    name: MoAI

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 1800000 # 30분 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

llm:
  api-key: ${LLM_API_KEY}
  api-url: https://generativelanguage.googleapis.com/v1beta/models
  model: gemini-3.1-flash-lite-preview

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  fallback-keys: ${YOUTUBE_FALLBACK_KEYS:}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION}

subtitle:
  script-path: src/main/resources/scripts/subtitle_scraper.py

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never